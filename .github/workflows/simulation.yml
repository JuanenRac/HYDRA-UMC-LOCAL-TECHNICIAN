#
# The simulation bench runs the real outbox and the real HTTP sender against a simulated receiver that refuses, redirects,
# hangs up, answers slowly and comes back, and runs the poisoned-document tests. The coverage job measures the statement
# coverage of the package and fails under the floor (raise COVERAGE_FLOOR when the measured value rises).
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_FLOOR: "94"

jobs:
  simulation:
    name: Simulated receiver and poisoned documents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package with its test extra
        run: python -m pip install ".[dev]"
      - name: Run the scenarios against the simulated receiver
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_transport_scenarios.py tests/unit/test_transport_and_snapshot.py \
            tests/unit/test_outbox_edges.py tests/unit/test_execution_mode_and_outbox.py tests/adversarial -q
          echo "SIMULATION_SCENARIOS=OK"
  coverage:
    name: Coverage with a floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package, its test extra and coverage
        run: python -m pip install ".[dev]" coverage
      - name: Run the tests under coverage and enforce the floor
        run: |
          PYTHONPATH=src python -m coverage run --source=src/hydra_umc_local_technician -m pytest tests -q
          python -m coverage report --skip-covered | tee cover.txt
          python -m coverage report --fail-under="$COVERAGE_FLOOR" > /dev/null
          {
            echo "### Coverage"
            echo
            echo '```'
            cat cover.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
