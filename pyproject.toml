[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-local-technician"
version = "0.0.1"
description = "Local, policy-gated AI maintenance technician for the HYDRA-UMC/URTC ecosystem: observes, explains and proposes - it never treats a model's own text as authority to act. Fase 0 only: the tool/risk-level matrix, the real JSON Schema contracts every future tool call must validate against, secret redaction, and a real adversarial test proving a malicious retrieved document can never trigger a tool or leak a secret."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "urtc", "local-technician", "ai", "hailo", "policy", "safety"]
# Deliberately stdlib-only for Fase 0 - the redaction/policy/contract-
# validation core needs no dependency at all. HailoRT GenAI and any RAG
# indexing library are later-phase additions, added only once that
# phase's own code actually needs them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/JuanenRac/HYDRA-UMC-LOCAL-TECHNICIAN"

[project.scripts]
hydra-umc-local-technician = "hydra_umc_local_technician.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
