<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HYDRA-UMC Local Technician</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="top">
  <div class="brand">
    <h1 data-i18n="title">Local Technician</h1>
    <p class="sub" data-i18n="subtitle">Read-only view of what the technician has observed and proposed</p>
  </div>
  <div class="controls">
    <label for="lang" data-i18n="language">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
      <option value="pt">Português (Portugal)</option>
    </select>
    <label for="token" data-i18n="token_label">Access token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="token_placeholder" placeholder="Only needed when the server asks for one">
  </div>
</header>
<p class="note" role="note" data-i18n="read_only_note">This page can only read. Nothing here changes the system.</p>
<nav aria-label="Sections" id="nav"></nav>
<main id="main" tabindex="-1">
  <p id="status" role="status" aria-live="polite" class="status"></p>
  <div class="panes">
    <section aria-labelledby="list-h" class="pane">
      <h2 id="list-h" data-i18n="list_heading">Items</h2>
      <ul id="list" class="list"></ul>
      <button id="more" type="button" hidden data-i18n="load_more">Load more</button>
    </section>
    <section aria-labelledby="detail-h" class="pane">
      <h2 id="detail-h" data-i18n="detail_heading">Detail</h2>
      <div id="detail" tabindex="0"></div>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
